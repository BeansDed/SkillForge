apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge
  labels:
    app: skillforge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: skillforge
  template:
    metadata:
      labels:
        app: skillforge
    spec:
      containers:
        - name: skillforge
          image: skillforge:latest
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skillforge-secrets
                  key: database-url
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: skillforge-secrets
                  key: clerk-secret-key
